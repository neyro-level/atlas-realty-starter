<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Заглушка обложки статьи</title>
  <desc id="desc">Светлая премиальная иллюстрация для материалов журнала без индивидуальной фотографии.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f4"/>
      <stop offset=".52" stop-color="#efede9"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
    <linearGradient id="accent" x1=".1" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#8a1515"/>
      <stop offset="1" stop-color="#c9a46a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#17161a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <path d="M0 575 C180 515 315 525 505 590 C690 655 850 655 1200 545 L1200 750 L0 750 Z" fill="#ffffff" opacity=".72"/>
  <path d="M82 96 H1118 V654 H82 Z" fill="none" stroke="#ded9d2" stroke-width="2"/>
  <path d="M126 140 H1074 V610 H126 Z" fill="#ffffff" opacity=".42"/>
  <g filter="url(#softShadow)">
    <rect x="402" y="188" width="396" height="292" rx="26" fill="#ffffff"/>
    <rect x="432" y="218" width="336" height="178" rx="18" fill="#f1efeb"/>
    <path d="M432 354 L530 286 L603 337 L666 296 L768 365 V396 H432 Z" fill="#e0dad2"/>
    <circle cx="704" cy="260" r="34" fill="#dbcfc2"/>
    <rect x="452" y="426" width="204" height="14" rx="7" fill="#d8d2cb"/>
    <rect x="452" y="454" width="278" height="10" rx="5" fill="#ebe7e1"/>
  </g>
  <path d="M514 540 H686" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="600" y="580" text-anchor="middle" fill="#17161a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Журнал о недвижимости</text>
  <text x="600" y="616" text-anchor="middle" fill="#756f6a" font-family="Arial, Helvetica, sans-serif" font-size="18">Материал о недвижимости</text>
</svg>
