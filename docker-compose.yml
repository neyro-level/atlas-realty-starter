services:
  postgres:
    container_name: soyuz-rostov-postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soyuz_rostov_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-soyuz_rostov_dev}',
        ]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres18_data:/var/lib/postgresql

volumes:
  postgres18_data:
