limit_req_zone $binary_remote_addr zone=atlas_payload_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=atlas_public_leads:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=atlas_public_reads:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name atlas.ams24.ru;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atlas.ams24.ru;

    # Bootstrap starts with a local certificate. Production provisioning replaces
    # these files with symlinks to the automatically renewed Let's Encrypt pair.
    ssl_certificate /etc/ams-platform/atlas-realty/tls/fullchain.pem;
    ssl_certificate_key /etc/ams-platform/atlas-realty/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    location = /healthz { proxy_pass http://127.0.0.1:3010; include proxy_params; }

    location = /api/users/login {
        client_max_body_size 64k;
        limit_req zone=atlas_payload_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3010;
        include proxy_params;
    }

    location = /api/public/v1/leads {
        client_max_body_size 32k;
        limit_req zone=atlas_public_leads burst=10 nodelay;
        proxy_pass http://127.0.0.1:3010;
        include proxy_params;
    }

    location ^~ /api/public/v1/ {
        limit_req zone=atlas_public_reads burst=60 nodelay;
        proxy_pass http://127.0.0.1:3010;
        include proxy_params;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:3010;
        include proxy_params;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3010;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        include proxy_params;
    }

    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
