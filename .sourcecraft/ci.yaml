# SourceCraft CI/CD - AMS Realty Platform Starter
# Pushes and pull requests intentionally run no workflows. Merge gates and
# release packaging are manual and fail closed on the selected full commit SHA.

workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: 'Full 40-character SHA reviewed for the STANDARD merge'
    tasks:
      - name: standard-gate
        checkout:
          fetch_depth: 1
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: static-contract
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
              - corepack enable
              - corepack prepare pnpm@11.24.0 --activate
              - pnpm install --frozen-lockfile
              - pnpm verify:schema
              - pnpm verify

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: 'Full 40-character SHA reviewed for the RISKY merge'
      release_check_site_url:
        type: string
        required: true
        description: 'Explicit HTTPS origin used by the production-shaped build check'
    tasks:
      - name: risky-gate
        checkout:
          fetch_depth: 1
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          RELEASE_CHECK_SITE_URL: ${{ inputs.release_check_site_url }}
        cubes:
          - name: production-contract
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
              - corepack enable
              - corepack prepare pnpm@11.24.0 --activate
              - pnpm install --frozen-lockfile
              - pnpm verify:schema
              - pnpm verify
              - pnpm release:build:check
              - pnpm release:public-env:check

  release:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: 'Full 40-character SHA from canonical SourceCraft main'
      confirm_release:
        type: choice
        required: true
        description: 'Must select release after owner approval'
        default: 'no'
        options:
          - 'no'
          - 'release'
      release_check_site_url:
        type: string
        required: true
        description: 'Explicit HTTPS production origin embedded into the release artifact'
    tasks:
      - name: exact-main-artifact
        checkout:
          fetch_depth: 0
          remove_credentials: false
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          RELEASE_CHECK_SITE_URL: ${{ inputs.release_check_site_url }}
          SOURCECRAFT_REPOSITORY: integrator-p/atlas-realty-starter
        cubes:
          - name: build-and-package
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - test "$CONFIRM_RELEASE" = "release"
              - test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
              - git fetch origin main --depth=1
              - test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT_SHA"
              - git remote set-url origin disabled://sourcecraft
              - corepack enable
              - corepack prepare pnpm@11.24.0 --activate
              - pnpm install --frozen-lockfile
              - pnpm generate:types
              - pnpm generate:importmap
              - git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
              - pnpm release:build:check
              - pnpm release:public-env:check
              - pnpm release:pack
            artifacts:
              paths:
                - .release-artifacts/release.part00
                - .release-artifacts/release.part01
                - .release-artifacts/release.part02
                - .release-artifacts/release.part03
                - .release-artifacts/release.part04
                - .release-artifacts/release.part05
                - .release-artifacts/release.part06
                - .release-artifacts/release.part07
                - .release-artifacts/release.part08
                - .release-artifacts/release.part09
                - .release-artifacts/release.json
